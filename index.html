<!-- Card Form / Selector de Citas Interactivo -->
<div class="lg:col-span-5">
    <div class="bg-white text-slate-900 p-8 rounded-3xl shadow-2xl border border-slate-100">
        <h3 class="text-2xl font-bold text-slate-900 mb-2">Reserva tu Cita en Oficina</h3>
        <p class="text-sm text-slate-600 mb-6">Selecciona el servicio, el día y la hora disponible para tu visita en la Plaza Caicedo.</p>
        
        <form id="citaForm" class="space-y-4" onsubmit="enviarCitaWhatsApp(event)">
            <div>
                <label class="block text-xs font-semibold text-slate-700 uppercase mb-1">Nombre Completo</label>
                <input type="text" id="nombre" required class="w-full px-4 py-3 rounded-xl border border-slate-200 focus:ring-2 focus:ring-blue-900 focus:outline-none text-sm" placeholder="Ej. Carlos Pérez">
            </div>

            <div>
                <label class="block text-xs font-semibold text-slate-700 uppercase mb-1">Servicio de Interés</label>
                <select id="servicio" required class="w-full px-4 py-3 rounded-xl border border-slate-200 focus:ring-2 focus:ring-blue-900 focus:outline-none text-sm bg-white">
                    <option value="">Selecciona un servicio...</option>
                    <option value="Crédito de Libranza">Crédito de Libranza</option>
                    <option value="Compra de Cartera">Compra de Cartera</option>
                    <option value="Libre Inversión">Libre Inversión</option>
                    <option value="Bancarización">Bancarización</option>
                    <option value="Crédito Hipotecario">Crédito Hipotecario</option>
                    <option value="Crédito Brilla">Crédito Brilla</option>
                </select>
            </div>

            <div class="grid grid-cols-2 gap-3">
                <div>
                    <label class="block text-xs font-semibold text-slate-700 uppercase mb-1">Fecha</label>
                    <input type="date" id="fecha" required class="w-full px-3 py-3 rounded-xl border border-slate-200 focus:ring-2 focus:ring-blue-900 focus:outline-none text-sm bg-white">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-700 uppercase mb-1">Hora Preferida</label>
                    <select id="hora" required class="w-full px-3 py-3 rounded-xl border border-slate-200 focus:ring-2 focus:ring-blue-900 focus:outline-none text-sm bg-white">
                        <option value="">Hora...</option>
                        <option value="09:00 AM">09:00 AM</option>
                        <option value="10:00 AM">10:00 AM</option>
                        <option value="11:00 AM">11:00 AM</option>
                        <option value="02:00 PM">02:00 PM</option>
                        <option value="03:00 PM">03:00 PM</option>
                        <option value="04:00 PM">04:00 PM</option>
                    </select>
                </div>
            </div>

            <button type="submit" class="w-full bg-emerald-600 hover:bg-emerald-500 text-white font-bold py-3.5 rounded-xl transition shadow-lg shadow-emerald-600/20 text-sm flex items-center justify-center gap-2">
                📅 Confirmar Cita por WhatsApp
            </button>
            <p class="text-[11px] text-center text-slate-500 mt-2">🔒 Oficina 608 - Ed. Plaza de Caicedo, Cali.</p>
        </form>
    </div>
</div>

<!-- Script de Automatización para WhatsApp -->
<script>
    // Establecer la fecha mínima como el día de hoy automáticamente
    document.getElementById('fecha').min = new Date().toISOString().split('T')[0];

    function enviarCitaWhatsApp(event) {
        event.preventDefault();
        
        const nombre = document.getElementById('nombre').value;
        const servicio = document.getElementById('servicio').value;
        const fecha = document.getElementById('fecha').value;
        const hora = document.getElementById('hora').value;
        
        const telefonoDestino = "573163582022";
        
        const mensaje = `Hola, quiero agendar una cita en la oficina.\n\n*Nombre:* ${nombre}\n*Servicio:* ${servicio}\n*Fecha:* ${fecha}\n*Hora:* ${hora}\n\nQuedo a la espera de su confirmación.`;
        
        const url = `https://wa.me/${telefonoDestino}?text=${encodeURIComponent(mensaje)}`;
        
        window.open(url, '_blank');
    }
</script>
